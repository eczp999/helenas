<!doctype html><meta charset="utf-8"><title>v</title>
<style>html,body{margin:0;background:#555;overflow:hidden}iframe{border:0;display:block}</style>
<body>
<script>
var q=new URLSearchParams(location.search);
var w=+(q.get('w')||1440),h=+(q.get('h')||900),y=+(q.get('y')||0);
var f=document.createElement('iframe');
f.src=q.get('p')||'/'; f.width=w; f.height=h;
f.addEventListener('load',function(){
  setTimeout(function(){
    try{
      var W=f.contentWindow;
      if (W.lenis) W.lenis.scrollTo(y,{immediate:true});
      else W.scrollTo(0,y);
      setTimeout(function(){
        try{ if(W.ScrollTrigger) W.ScrollTrigger.update(); }catch(e){}
        document.title='y='+Math.round(W.scrollY)+' de '+W.document.documentElement.scrollHeight;
      },600);
    }catch(err){ document.title='EXC '+err.message; }
  },1500);
});
document.body.appendChild(f);
</script>
